<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XBlock – YouTube banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  /* YouTube banner, 1024×576: brand on the left, a troll's post sliced in two on the right */
  :root { --line: #2f3336; --muted: #71767b; --red: #f4212e; --orange: #ff7a1a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  #banner {
    position: relative; width: 1024px; height: 576px; overflow: hidden; background: #05060a; color: #e7e9ea;
    font-family: Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  #grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 44px 44px; background-position: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse at 65% 50%, #000 25%, transparent 75%);
  }
  #kanji { position: absolute; left: 770px; top: 300px; transform: translate(-50%, -53%); font: 900 560px/1 "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; color: rgba(255,45,85,.08); }
  #grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6)); }

  /* brand */
  #brand { position: absolute; left: 60px; top: 50%; transform: translateY(-50%); width: 470px; }
  .kicker { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font: 700 15px/1 Inter, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--red); }
  .kicker::before { content: ""; width: 32px; height: 2px; background: var(--red); }
  .logo-row { display: flex; align-items: center; gap: 18px; }
  .logo-row img { width: 82px; height: 82px; border-radius: 21px; box-shadow: 0 0 60px rgba(244,33,46,.55); }
  .word { font: 900 100px/1 Outfit, sans-serif; letter-spacing: -.04em; }
  .tag { margin-top: 20px; font: 700 34px/1.18 Outfit, sans-serif; letter-spacing: -.01em; color: #e7e9ea; }
  .accent { background: linear-gradient(90deg, var(--orange), var(--red)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 24px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font: 600 15px Inter, sans-serif; white-space: nowrap; }
  .chip svg { color: var(--red); flex-shrink: 0; }

  /* sliced post */
  #cut { position: absolute; left: 560px; top: 228px; width: 420px; transform: rotate(-8deg); }
  .piece { position: absolute; left: 0; top: 0; width: 100%; filter: drop-shadow(0 22px 40px rgba(0,0,0,.65)); }
  .card { background: #000; border: 1px solid #3a3f44; border-radius: 16px; overflow: hidden; display: flex; gap: 12px; padding: 17px 19px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font: 700 18px Outfit, sans-serif; color: #fff; background: #f91880; }
  .tw-head { font-size: 16px; display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
  .tw-head b { font-weight: 700; }
  .tw-head span { color: var(--muted); }
  .tw-text { font-size: 17px; line-height: 1.38; margin-top: 3px; }
  .tw-actions { display: flex; gap: 52px; margin-top: 11px; }
  .tw-actions i { width: 18px; height: 5px; border-radius: 3px; background: #2f3336; display: block; }
  #slash { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>

<script>
// A troll's post cut in two along a diagonal, the halves pushed apart, with a blade streak and sparks
const card = `<div class="card"><div class="avatar">N</div><div><div class="tw-head"><b>Night Troll</b><span>@troll_of_the_night · 2h</span></div><div class="tw-text">Nobody asked for your opinion. Ratio.</div><div class="tw-actions"><i></i><i></i><i></i><i></i></div></div></div>`;
const lerp = (a, b, x) => a + (b - a) * x;
document.fonts.ready.then(() => {
  const cut = document.getElementById("cut");
  cut.innerHTML = `<div style="visibility:hidden">${card}</div>`;
  const W = cut.offsetWidth, H = cut.firstChild.offsetHeight;
  cut.style.height = H + "px";

  const top = { x: 232, y: 0 }, bot = { x: 172, y: H };
  const len = Math.hypot(bot.x - top.x, bot.y - top.y), u = { x: (bot.x - top.x) / len, y: (bot.y - top.y) / len };
  const n = { x: -u.y, y: u.x }, left = n.x < 0 ? n : { x: -n.x, y: -n.y };
  const gap = 24;
  const halves = [
    { poly: [[0, 0], [top.x, 0], [bot.x, H], [0, H]], off: [left.x * gap, left.y * gap + 5], rot: -3 },
    { poly: [[top.x, 0], [W, 0], [W, H], [bot.x, H]], off: [-left.x * gap, -left.y * gap - 4], rot: 2.5 },
  ];
  const pivot = [(top.x + bot.x) / 2, H / 2];
  cut.innerHTML = halves.map(h => `<div class="piece" style="height:${H}px;transform-origin:${pivot[0]}px ${pivot[1]}px;transform:translate(${h.off[0]}px,${h.off[1]}px) rotate(${h.rot}deg)"><div style="clip-path:polygon(${h.poly.map(p => p.join("px ") + "px").join(",")})">${card}</div></div>`).join("");

  const rot = (p, deg, off) => {
    const a = deg * Math.PI / 180, x = p.x - pivot[0], y = p.y - pivot[1];
    return { x: pivot[0] + x * Math.cos(a) - y * Math.sin(a) + off[0], y: pivot[1] + x * Math.sin(a) + y * Math.cos(a) + off[1] };
  };
  const ext = 230, s1 = { x: top.x - u.x * ext, y: top.y - u.y * ext }, s2 = { x: bot.x + u.x * ext, y: bot.y + u.y * ext };
  let svg = `<svg id="slash" width="${W}" height="${H}"><defs>
      <linearGradient id="blade" gradientUnits="userSpaceOnUse" x1="${s1.x}" y1="${s1.y}" x2="${s2.x}" y2="${s2.y}"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".95"/><stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="bladeGlow" gradientUnits="userSpaceOnUse" x1="${s1.x}" y1="${s1.y}" x2="${s2.x}" y2="${s2.y}"><stop offset="0" stop-color="#ff2d55" stop-opacity="0"/><stop offset=".4" stop-color="#ff2d55" stop-opacity=".75"/><stop offset=".8" stop-color="#ff4664" stop-opacity=".9"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></linearGradient>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="hot" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>`;
  halves.forEach(h => {
    const a = rot(top, h.rot, h.off), b = rot(bot, h.rot, h.off);
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#ff7a1a" stroke-width="6" filter="url(#hot)" opacity=".9"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#ffd65a" stroke-width="2" stroke-linecap="round"/>`;
  });
  svg += `<line x1="${s1.x}" y1="${s1.y}" x2="${s2.x}" y2="${s2.y}" stroke="url(#bladeGlow)" stroke-width="19" stroke-linecap="round" filter="url(#soft)"/>
          <line x1="${s1.x}" y1="${s1.y}" x2="${s2.x}" y2="${s2.y}" stroke="url(#bladeGlow)" stroke-width="8" stroke-linecap="round"/>
          <line x1="${s1.x}" y1="${s1.y}" x2="${s2.x}" y2="${s2.y}" stroke="url(#blade)" stroke-width="2.6" stroke-linecap="round"/>`;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const HEAT = ["#ffffff", "#ffe08a", "#ffb340", "#ff7a1a", "#ff4630"];
  for (let i = 0; i < 28; i++) {
    const f = .1 + rnd() * .8, side = rnd() < .5 ? 1 : -1, sp = 26 + rnd() * 60, along = -16 + rnd() * 50;
    const x = lerp(top.x, bot.x, f), y = lerp(top.y, bot.y, f), vx = left.x * side * sp + u.x * along, vy = left.y * side * sp + u.y * along - 8, k = .18 + rnd() * .22;
    svg += `<line x1="${x + vx * (1 - k)}" y1="${y + vy * (1 - k)}" x2="${x + vx}" y2="${y + vy}" stroke="${HEAT[Math.floor(rnd() * HEAT.length)]}" stroke-width="${1.1 + rnd() * 1.6}" stroke-linecap="round" opacity="${.55 + rnd() * .45}"/>`;
  }
  cut.insertAdjacentHTML("beforeend", svg + "</svg>");
  document.body.dataset.ready = "1";
});
</script>
